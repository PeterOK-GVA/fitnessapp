build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 10
    ignoreAnnotated: ['Composable']
  LongMethod:
    threshold: 80
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInClasses: 20
    thresholdInFiles: 25
    thresholdInInterfaces: 20
  CyclomaticComplexMethod:
    threshold: 20
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    excludes: ['**/test/**', '**/androidTest/**', '**/*Test.kt', '**/*Spec.kt', '**/theme/**', '**/seed/**', '**/*Screen.kt', '**/migrations/**']
    ignoreAnnotated: ['Preview']
    ignoreNumbers: ['-1', '0', '1', '2', '100']
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 4
  WildcardImport:
    excludes: ['**/test/**']
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|ignored|expected|serialVersionUID)'
    ignoreAnnotated: ['Preview', 'Composable']

formatting:
  active: true
  android: true
  autoCorrect: true
  Indentation:
    indentSize: 4
  MaximumLineLength:
    maxLineLength: 140
  TrailingCommaOnCallSite:
    active: true
    useTrailingCommaOnCallSite: true
  TrailingCommaOnDeclarationSite:
    active: true
    useTrailingCommaOnDeclarationSite: true
